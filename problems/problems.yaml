course:
  code: AICE3001/AICE6002
  title: Mathematics of Machine Learning
  author: Adam Prugel-Bennett

# ---------------------------------------------------------------------------
# Output. Sheets are published to <site_dir>/problem_pdf/ and listed on
# problems_page. answers_page also carries the worked answers -- it is not
# linked from anywhere, so it is unlisted rather than secure. Give the URL to
# demonstrators. Keep the filename stable or their link breaks.
# ---------------------------------------------------------------------------
site_dir: ../site
problems_page: problems.html
answers_page: problems-answers-23948017554dfbf8.html

# ---------------------------------------------------------------------------
# Releasing answers. Each sheet's answers appear on the public problems page
# once its tutorial has been taught; until then the answer PDF is published
# under an unguessable name so demonstrators can still reach it from the
# answers page.
#
#   auto   release after the tutorial date in tutorial_dates.yaml, which
#          lectures/make_timetable.py derives from term_start. Change the
#          year and everything un-releases by itself.
#   none   release nothing
#   all    release everything
#
# A sheet may override the decision with `release: true` or `release: false`.
# Nothing is released until the site is rebuilt and pushed: this is a static
# site, so the date is consulted at build time, not by the browser.
# ---------------------------------------------------------------------------
release_answers: auto
release_delay_days: 0
answers_token: 23948017554dfbf8

sheets:
  - week: 1
    name: calculus
    keywords: math 101, matrices, differentiation
  - week: 2
    name: vectorSpaces
    keywords: Cauchy-Schwarz, Inner-product spaces, induced norms
  - week: 3
    name: eigen
    keywords: Eigensystems, PCA, SVD
  - week: 4
    name: optimisation
    keywords: Gradient descent, Newton's method, momentum, SGD, Lagrange multipliers, duality
  - week: 5
    name: convexity
    keywords: convexity, SVMs
  - week: 6
    name: general
    keywords: duality
  - week: 7
    name: probability
    keywords: Gaussian integrals
  - week: 8
    name: gp
    keywords: Gaussian processes
  - week: 9
    name: information
    keywords: entropy, information
  - week: 10
    name: theory
    keywords: bias variance
  - week: 11
    name: revision
    keywords: general
